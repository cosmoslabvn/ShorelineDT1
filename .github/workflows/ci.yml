name: public-release-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit disclosure boundary
        run: python scripts/audit_release.py

      - name: Run offline tests
        run: |
          python -m unittest discover -s scripts/demo -p "test_*.py"
          python -m unittest discover -s scripts/numerics -p "test_*.py"

      - name: Run synthetic demonstration
        run: python scripts/demo/run_demo.py
